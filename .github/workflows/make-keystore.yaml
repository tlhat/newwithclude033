name: 1 - Make signing key (run ONCE)

on:
  workflow_dispatch:

jobs:
  make:
    runs-on: ubuntu-latest
    steps:
      - name: Check password secret exists
        env:
          PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ ${#PASS} -lt 8 ]; then echo "Add the secret KEYSTORE_PASSWORD (8+ characters) first"; exit 1; fi

      - name: Create keystore
        env:
          PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          keytool -genkeypair -v -keystore /tmp/haneen.jks -storetype PKCS12 \
            -alias haneen -keyalg RSA -keysize 2048 -validity 36500 \
            -storepass "$PASS" -keypass "$PASS" \
            -dname "CN=Haneen Kids, O=Haneen Kids, C=EG"
          echo "=============== YOUR SHA-1 (copy the line below) ==============="
          keytool -list -v -keystore /tmp/haneen.jks -storepass "$PASS" -alias haneen | grep -E "SHA1|SHA256"
          echo "================================================================"
          # Encrypted with your password, so the file alone is useless to anyone else.
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:PASS \
            -in /tmp/haneen.jks -out /tmp/keystore.jks.enc

      - uses: actions/upload-artifact@v4
        with:
          name: keystore-encrypted
          path: /tmp/keystore.jks.enc
