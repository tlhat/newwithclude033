plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace "com.haneenkids.vod.haneen_kids_vod"
    compileSdk 36
    compileSdkVersion 36

    defaultConfig {
        applicationId "com.haneenkids.vod.haneen_kids_vod"
        minSdk 24
        minSdkVersion 24
        targetSdk 36
        targetSdkVersion 36
        versionCode 20
        versionName "5.0.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
        }
    }
}

flutter {
    source "../.."
}
