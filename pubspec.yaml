name: haneen_kids_vod
description: Safe 100% Free Educational Platform for Kids with ElevenLabs Neural Voices, Interactive Academy, 200 Animated Stories, 10 Brain Games & 6-Digit Parental Controls
publish_to: 'none'
version: 5.0.8+32

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  video_player: '>=2.8.2 <3.0.0'
  http: '>=1.2.0 <2.0.0'
  shared_preferences: '>=2.2.2 <3.0.0'
  crypto: '>=3.0.3 <4.0.0'
  flutter_secure_storage: '>=9.0.0 <12.0.0'
  google_sign_in: '>=6.2.1 <7.0.0'
  in_app_review: '>=2.0.9 <3.0.0'
  record: '>=6.0.0 <7.0.0'
  in_app_purchase: '>=3.2.0 <4.0.0'
  path_provider: '>=2.1.0 <3.0.0'

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: '>=3.0.1 <7.0.0'
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon-removebg.png"
  min_sdk_android: 21
  remove_alpha_ios: true

flutter:
  generate: true
  uses-material-design: true
  assets:
    # audio-assets-begin
    - assets/audio/audio_index.json
    - assets/audio/cheerful_friend/companion/
    - assets/audio/cheerful_friend/games_classify/
    - assets/audio/cheerful_friend/games_etiquette/
    - assets/audio/cheerful_friend/games_math/
    - assets/audio/cheerful_friend/games_memory/
    - assets/audio/cheerful_friend/games_odd/
    - assets/audio/cheerful_friend/games_pattern/
    - assets/audio/cheerful_friend/games_pictureword/
    - assets/audio/cheerful_friend/games_riddle/
    - assets/audio/cheerful_friend/games_sound/
    - assets/audio/cheerful_friend/games_word/
    - assets/audio/cheerful_friend/hero_alerts/
    - assets/audio/cheerful_friend/lesson_feedback/
    - assets/audio/cheerful_friend/reactions/
    - assets/audio/cheerful_friend/stories/
    - assets/audio/haneen/academy_hints/
    - assets/audio/haneen/app/
    - assets/audio/haneen/brain_games/
    - assets/audio/haneen/companion/
    - assets/audio/haneen/games_classify/
    - assets/audio/haneen/games_etiquette/
